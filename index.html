const APP_BUILD=document.querySelector('meta[name="app-build"]')?.content||"dev",DB_VERSION=1,DATA_V=1,MIG={}; /* MIG[n]=async({N,S,T})=>{...} upgrades data from n-1 to n; bump DATA_V when adding one */
const rawPut=(k,v)=>DB.op("kv","readwrite",o=>o.put(v,k)),rawGet=k=>DB.op("kv","readonly",o=>o.get(k));
async function migrate(){const m=await rawGet("meta"),from=(m&&m.dataV)||1;

try{await rawPut(key,{at:Date.now(),from,notes:N,settings:S,tasks:T})}catch(e){note2("Data update paused","A safety copy couldn't be made, so your data was left unchanged.");return}
try{for(let v=from+1;v<=DATA_V;v++)if(MIG[v])await MIG[v]({N,S,T});for(const n of N)await DB.put("notes",n);await saveS();await saveT()}
catch(e){try{const b=await rawGet(key);N=b.notes;S=b.settings;T=b.tasks;for(const n of N)await DB.put("notes",n);await saveS();await saveT()}catch(_){}note2("Data update failed","Your notes were restored from a safety copy taken just before. Nothing was lost.");return}}
